# Local PostgreSQL-backed stack. Copy .env.example to .env before the first run:
# the secrets below have no defaults on purpose, so an unconfigured stack fails to
# start rather than coming up with a key someone forgot to replace.
#
#   docker compose up -d
#   docker compose run --rm momobase seed-admin -email you@example.com -password '...'
#
# Then open http://localhost:9090/dashboard/.

services:
    momobase:
        build:
            context: .
            args:
                VERSION: ${VERSION:-dev}
        image: ghcr.io/momobasehq/server:${TAG:-latest}
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "${APP_PORT:-9090}:9090"
        environment:
            APP_ENV: ${APP_ENV:-development}
            APP_ADDR: ":9090"
            APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:9090}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:9090}
            LOG_LEVEL: ${LOG_LEVEL:-info}

            DB_TYPE: postgres
            DB_HOST: db
            DB_PORT: "5432"
            DB_USER: ${POSTGRES_USER:-momobase}
            DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            DB_NAME: ${POSTGRES_DB:-momobase}
            DB_SSLMODE: ${DB_SSLMODE:-disable}

            # openssl rand -base64 32
            ENCRYPTION_MASTER_KEY_BASE64: ${ENCRYPTION_MASTER_KEY_BASE64:?set ENCRYPTION_MASTER_KEY_BASE64 in .env}
            # openssl rand -hex 32
            ADMIN_OAUTH_SECRET: ${ADMIN_OAUTH_SECRET:?set ADMIN_OAUTH_SECRET in .env}
            APP_OAUTH_SECRET: ${APP_OAUTH_SECRET:?set APP_OAUTH_SECRET in .env}
        volumes:
            - momobase-data:/data

    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-momobase}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-momobase}
        # Momobase migrates on start-up, so it must not connect before the server is
        # actually accepting queries rather than merely running.
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momobase} -d ${POSTGRES_DB:-momobase}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    momobase-data:
    postgres-data:
