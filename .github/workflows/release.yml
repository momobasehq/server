name: Release

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to build, such as v1.2.3"
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    # Every target cross-compiles from this one runner now that no target links C,
    # which also means the dashboard bundle is built once rather than once per target.
    binaries:
        name: Build release binaries
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag || github.ref_name }}

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum

            - name: Set up pnpm
              uses: pnpm/setup@v2
              with:
                  version: ^11.24.0
                  runtime: node@24

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: dashboard/pnpm-lock.yaml

            - name: Build dashboard bundle
              run: make dashboard

            - name: Resolve version
              id: version
              shell: bash
              run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

            - name: Build and package
              shell: bash
              env:
                  CGO_ENABLED: "0"
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
                    export GOOS="${target%/*}" GOARCH="${target#*/}"
                    # dist is rebuilt per target so a tarball cannot pick up the
                    # previous architecture's binary alongside its own.
                    rm -rf dist && mkdir -p dist
                    go build -trimpath \
                      -ldflags "-s -w -X main.version=${VERSION}" \
                      -o dist/momobase ./cmd/momobase
                    cp README.md LICENSE.txt dist/ 2>/dev/null || cp README.md dist/
                    name="momobase_${VERSION}_${GOOS}_${GOARCH}"
                    tar -czf "${name}.tar.gz" -C dist .
                    shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
                  done

            - name: Upload builds
              uses: actions/upload-artifact@v7
              with:
                  name: momobase-binaries
                  path: |
                      *.tar.gz
                      *.tar.gz.sha256
                  if-no-files-found: error
                  retention-days: 7

    release:
        name: Publish GitHub release
        needs: binaries
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Download builds
              uses: actions/download-artifact@v6
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Collect checksums
              working-directory: artifacts
              run: cat *.sha256 > SHA256SUMS && rm -f *.sha256

            - name: Publish
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ inputs.tag || github.ref_name }}
                  generate_release_notes: true
                  files: |
                      artifacts/*.tar.gz
                      artifacts/SHA256SUMS

    image:
        name: Publish container image
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.tag || github.ref_name }}

            # arm64 is built under emulation. It is slow, which is why this job's
            # timeout is generous, but it keeps the image a single multi-arch manifest.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Derive tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
                      type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  provenance: mode=max
                  sbom: true
                  build-args: |
                      VERSION=${{ inputs.tag || github.ref_name }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
